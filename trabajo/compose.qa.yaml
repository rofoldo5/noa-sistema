services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: noa_work_test
      POSTGRES_USER: noa_test
      POSTGRES_PASSWORD: qa-only-not-production
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noa_test -d noa_work_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [qa_private]

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: sqlite:////tmp/noa_work_unit.db
      NOA_TEST_POSTGRES_URL: postgresql+psycopg://noa_test:qa-only-not-production@db-test:5432/noa_work_test
      IDENTITY_API_URL: http://identity-not-used.invalid
      WORK_DEPARTMENT_ID: "10"
      ATTACHMENT_STORAGE_PATH: /tmp/noa-work-attachments
      MAX_ATTACHMENT_BYTES: "104857600"
      MEDIA_PREVIEW_SECRET: testing-only-preview-secret-at-least-32-chars
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db-test:
        condition: service_healthy
    networks: [qa_private]

networks:
  qa_private:
    internal: true
