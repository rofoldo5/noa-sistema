services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trabajo}
      POSTGRES_USER: ${POSTGRES_USER:-trabajo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - trabajo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trabajo} -d ${POSTGRES_DB:-trabajo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [work_private]

  work-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://trabajo:${POSTGRES_PASSWORD}@db:5432/trabajo
      IDENTITY_API_URL: ${IDENTITY_API_URL:-http://identity-api:8000}
      WORK_DEPARTMENT_ID: ${WORK_DEPARTMENT_ID:?Define WORK_DEPARTMENT_ID en .env}
      ATTACHMENT_STORAGE_PATH: /data/attachments
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
      MEDIA_PREVIEW_SECRET: ${MEDIA_PREVIEW_SECRET:?Define MEDIA_PREVIEW_SECRET en .env}
    volumes:
      - trabajo_attachments:/data/attachments
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - work_private
      - identity_network
      - work_api
    # No se establece no-new-privileges aqui porque el host local con Docker Snap
    # tiene una denegacion AppArmor reproducida al activar esa opcion.
    # Mantener usuario no root, filesystem read-only y cap_drop ALL.

volumes:
  trabajo_pgdata:
  trabajo_attachments:

networks:
  work_private:
    internal: true
  identity_network:
    external: true
    name: backend_identity_api
  work_api:
    name: trabajo_work_api
    internal: true
