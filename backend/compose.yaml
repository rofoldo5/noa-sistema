services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identidad
      POSTGRES_USER: identidad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
    volumes:
      - identidad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identidad -d identidad"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://identidad:${POSTGRES_PASSWORD}@db:5432/identidad
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      identity_api:
        aliases: [identity-api]
volumes:
  identidad_pgdata:
networks:
  internal:
  identity_api:
    name: backend_identity_api
