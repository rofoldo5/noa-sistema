<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor • Identidad</title><style>
:root{font-family:system-ui,sans-serif;color:#172337;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:970px;margin:40px auto;padding:0 18px}h1{font-size:27px;margin-bottom:4px}h2{font-size:19px}.muted{color:#657287}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:20px;margin-top:18px;box-shadow:0 4px 18px #102b4b0a}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #cdd7e4;width:100%;margin:5px 0 10px}button{background:#17479e;color:white;border:none;cursor:pointer}button.secondary{background:#eaf0fa;color:#17375d}button.small{width:auto;padding:7px 12px;margin:0}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #ebeff4;padding:10px}th{color:#657287}#notice{white-space:pre-wrap;margin:10px 0;color:#17479e} .pill{font-size:12px;padding:3px 8px;border-radius:30px;background:#ecf3ff} .actions{display:flex;gap:8px;flex-wrap:wrap} @media(max-width:580px){main{margin:16px auto}td,th{padding:6px;font-size:12px}}
</style></head><body><main><header><h1>Gestor de trabajo</h1><div class="muted">Acceso y administración de personas</div></header><div id="notice" aria-live="polite"></div>
<section id="access"><div class="row"><div class="card"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></div><div class="card"><h2>Solicitar cuenta</h2><form id="registerForm"><label>Nombre<input name="name" required minlength="2"></label><label>Correo<input name="email" type="email" required></label><label>Contraseña (12 caracteres mínimo)<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><button class="secondary">Enviar solicitud</button></form></div></div></section>
<section id="workspace" class="hidden"><div class="card"><div class="row" style="align-items:center"><div><h2 id="welcome"></h2><div id="role" class="muted"></div></div><div><button class="secondary" id="logout">Cerrar sesión</button></div></div></div><section id="admin" class="hidden"><div class="card"><h2>Crear departamento</h2><form id="departmentForm" class="row"><input name="name" placeholder="Nombre del departamento" minlength="2" required><button>Crear</button></form></div><div class="card"><div class="row" style="align-items:center"><h2>Usuarios y solicitudes</h2><button class="secondary" id="refresh">Actualizar lista</button></div><div style="overflow:auto"><table><thead><tr><th>Persona</th><th>Estado</th><th>Rol</th><th>Acciones</th></tr></thead><tbody id="userRows"></tbody></table></div></div><div class="card"><h2>Asignar integrante a departamento</h2><form id="membershipForm" class="row"><select id="memberUser" required></select><select id="memberDepartment" required></select><button>Asignar</button></form></div></section><div class="card"><h2>Mis departamentos</h2><p id="myDepartments" class="muted"></p></div></section></main>
<script>
let token=sessionStorage.getItem('access_token')||'';
const $=id=>document.getElementById(id);
const note=(v)=>$('notice').textContent=v;
async function api(path,method='GET',body){const resp=await fetch(path,{method,headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let out=await resp.json();if(!resp.ok)throw Error(typeof out.detail==='string'?out.detail:'Solicitud rechazada');return out}
function formObject(form){return Object.fromEntries(new FormData(form).entries())}
function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}
async function load(){if(!token)return;try{const user=await api('/auth/me');$('access').classList.add('hidden');$('workspace').classList.remove('hidden');$('welcome').textContent='Hola, '+user.name;$('role').textContent='Rol: '+user.role;const deps=await api('/departments');$('myDepartments').textContent=deps.map(d=>d.name).join(', ')||'Sin departamentos asignados';$('admin').classList.toggle('hidden',user.role!=='SUPERADMIN');if(user.role==='SUPERADMIN')await refreshAdmin()}catch(e){token='';sessionStorage.removeItem('access_token');$('access').classList.remove('hidden');$('workspace').classList.add('hidden');note(e.message)}}
async function allRoles(){let out=[];for(let offset=0;;offset+=100){const part=await api('/admin/roles?limit=100&offset='+offset);out.push(...part);if(part.length<100)return out}}
async function refreshAdmin(){
 const [users,deps,roles]=await Promise.all([api('/users?limit=100'),api('/departments'),allRoles()]);
 const rows=$('userRows');rows.replaceChildren();
 for(const u of users){
  const tr=document.createElement('tr');tr.append(el('td',u.name+' ('+u.email+')'),el('td',u.active?'Activo':'Pendiente o suspendido'));
  const td=document.createElement('td'),role=document.createElement('select');
  for(const r of roles.filter(r=>r.active||r.code===u.role)){const op=el('option',r.name+(r.active?'':' (inactivo)'));op.value=r.code;op.selected=r.code===u.role;role.append(op)}
  td.append(role);tr.append(td);
  const act=document.createElement('td'),save=el('button','Guardar rol');save.className='small';
  save.onclick=async()=>{save.disabled=true;try{await api('/admin/users/'+u.id,'PATCH',{role:role.value});note('Rol actualizado. Si cambio, el usuario debe iniciar sesion otra vez.');await refreshAdmin()}catch(e){note(e.message)}finally{save.disabled=false}};
  const toggle=el('button',u.active?'Suspender':'Activar');toggle.className='small secondary';
  toggle.onclick=async()=>{toggle.disabled=true;try{await api('/admin/users/'+u.id,'PATCH',{active:!u.active});note('Estado actualizado');await refreshAdmin()}catch(e){note(e.message)}finally{toggle.disabled=false}};
  act.append(save,document.createTextNode(' '),toggle);tr.append(act);rows.append(tr);
 }
 for(const [id,list,key,make] of [['memberUser',users,'id',u=>u.name+' - '+u.email],['memberDepartment',deps,'id',d=>d.name]]){const select=$(id);select.replaceChildren();for(const item of list){const op=el('option',make(item));op.value=item[key];select.append(op)}}
}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const x=await api('/auth/login','POST',formObject(e.target));token=x.access_token;sessionStorage.setItem('access_token',token);note('');await load()}catch(err){note(err.message)}};
$('registerForm').onsubmit=async e=>{e.preventDefault();try{const x=await api('/auth/register','POST',formObject(e.target));note(x.message);e.target.reset()}catch(err){note(err.message)}};
$('departmentForm').onsubmit=async e=>{e.preventDefault();try{await api('/admin/departments','POST',formObject(e.target));note('Departamento creado');e.target.reset();await load()}catch(err){note(err.message)}};
$('membershipForm').onsubmit=async e=>{e.preventDefault();try{await api('/admin/memberships','POST',{user_id:Number($('memberUser').value),department_id:Number($('memberDepartment').value)});note('Integrante asignado');await load()}catch(err){note(err.message)}};
$('refresh').onclick=()=>refreshAdmin().catch(e=>note(e.message));$('logout').onclick=async()=>{try{await api('/auth/logout','POST')}catch{}token='';sessionStorage.removeItem('access_token');location.reload()};load();
</script></body></html>
