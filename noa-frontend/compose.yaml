services:
  noa-frontend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    cap_drop: [ALL]
    # En el host de desarrollo, Docker Snap + AppArmor deniega exec con no-new-privileges.
    # Se conserva usuario nginx no privilegiado, read_only y cap_drop ALL.
    networks:
      - identity_api
      - work_api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  identity_api:
    external: true
    name: backend_identity_api
  work_api:
    external: true
    name: trabajo_work_api
